<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/style.css">

<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>

      </section>
    </div>
  </main>
  
  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>
  
  <script>
    'use strict';
    
    const number = Math.floor(Math.random() * 6);
    const answer = parseInt(window.prompt('0～5'));
    
    let message;
    if (answer === number) {
      message = 'あたり！';
    } else if (answer < number) {
      message = '残念。もっと大きい';
    } else if (answer > number) {
      message = '残念。もっと小さい';
    } else {
      message = '0～5の数字を入力してね';
    }
    window.alert(message);
  </script>
</body>
</html>
