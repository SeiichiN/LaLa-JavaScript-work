<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>

      </section>
    </div>
  </main>
  
  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>
  
  <script>
    'use strict';
    
    let enemy = 100;
    let count = 0;
    
    window.alert('戦闘スタート!');
    
    while (enemy > 0) {
      const attack = 1 + Math.floor(Math.random() * 30);
      alert('モンスターに' + attack + 'のダメージ');
      enemy -= attack;
      count += 1;
      if (enemy > 0) {
        alert('モンスターの体力:' + enemy);
      }
    }
    alert(count + '回でモンスターを倒した!');
  </script>
</body>
</html>
