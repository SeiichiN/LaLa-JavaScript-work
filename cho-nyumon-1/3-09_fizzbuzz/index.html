  <script>
    'use strict';
    
    function fizzbuzz(num) {
      if (num % 3 === 0 && num % 5 === 0) {
        return 'fizzbuzz';
      } else if (num % 3 === 0) {
        return 'fizz';
      } else if (num % 5 === 0) {
        return 'buzz';
      } else {
        return num;
      }
    }  //end
    
    let n = 1;
    while (n <= 30) {
      console.log(fizzbuzz(n));
      n += 1;
    }
  </script>
