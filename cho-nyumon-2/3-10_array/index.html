<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
				<h1>やることリスト</h1>
				<ul id="list">
				</ul>
      </section>
    </div>
  </main>
  
  <footer>
    <div class="container" id="cp">
      <p>JavaScript Samples</p>
    </div>
  </footer>
  
  <script>
    'use strict';
    
    let todo = [
          'デザインカンプ作成', 
	        'データ整理', 
	        '勉強会申し込み',
	        '牛乳買う',
	      ];
	  todo.push('歯医者にいく', '自転車にのる');
	                                // console.log(todo);
	  for (let item of todo) {
	    const li = `<li>${item}</li>`;
	    document.getElementById('list')
	            .insertAdjacentHTML('beforeend', li);
	  }
	  
	  const cp = '<small>&copy; Seiichi Nukayama</small>';
	  document.getElementById('cp')
	          .insertAdjacentHTML('beforeend', cp);
  </script>
</body>
</html>
