<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
        <p>いまから <span id="timer"></span> 以内に注文すると５０％オフ！</p>
      </section>
    </div>
  </main>
  
  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>
  
  <script>
    'use strict';
    
    /**
     * due(期限)まであと何日、何時間、何分、何秒か
     * due -- 未来のDateオブジェクト 
     *     (new Date(2028, 7, 14))  ロスオリンピック
     * 戻り値 - 配列[日,時,分,秒]
     */
    function countdown(due) {
    	const now = new Date();  // 現在のDateオブジェクト
    	// Date--1970/1/1からの経過ミリ秒
    	// rest -- 60858583196 ミリ秒
    	const rest = due.getTime() - now.getTime();
			const sec = Math.floor(rest / 1000) % 60;
			const min = Math.floor(rest / 1000 / 60) % 60;
			const hours = Math.floor(rest / 1000 / 60 / 60) % 24;
			const days = Math.floor(rest / 1000 / 60 / 60 / 24);
			const count = [days, hours, min, sec];
			// console.log(count);
			return count;
    }
    
    function recalc() {
      const counter = countdown(goal);
      const time = `${counter[1]}時間 ${counter[2]}分 ${counter[3]}秒`;
      document.getElementById('timer').textContent = time;
      refresh();
    }
    
    function refresh() {
      setTimeout(recalc, 1000);
    }
    
    let goal = new Date();
    goal.setHours(23);
    goal.setMinutes(59);
    goal.setSeconds(59);
    
    recalc();
    
    // const target = new Date(2028,7,14);
    // countdown(target); // 60858583196
  </script>
</body>
</html>
