<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .list {
      overflow: hidden;  /* float:left 対策 */
      margin: 0;
      padding: 0;
      list-style-type: none;
    }

    .list h2 {
      margin: 0 0 2em 0;
      font-size: 16px;
      text-align: center;
    }

    .seminar {
      float: left;
      margin: 10px 10px 10px 0;
      border: 1px solid #23628f;
      padding: 4px;
      width: 25%;
    }

    .check {
      margin: 0;
      padding: 8px;
      font-size: 12px;
      color: #ffffff;
      background-color: #23628f;
      text-align: center;
      cursor: pointer;
    }

    .red {
      background-color: #e33a6d;
    }

    .green {
      background-color: #7bc52e;
    }
  </style>

</head>

<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
        <ul class="list">
          <li class="seminar" id="js">
            <h2>JavaScript勉強会</h2>
            <p class="check">空き席状況を確認</p>
          </li>
          <li class="seminar" id="security">
            <h2>セキュリティ対策講座</h2>
            <p class="check">空き席状況を確認</p>
          </li>
          <li class="seminar" id="aiux">
            <h2>AIを利用したUX設計</h2>
            <p class="check">空き席状況を確認</p>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script>
    'use strict';

    $(function(){
      $.ajax({url: 'data.json', dataType: 'json'})
        .done(function(data){
          data.forEach(function(item, index){
            if (item.crowded === 'yes') {
              const idName = '#' + item.id;
              $(idName).find('.check').addClass('crowded');
            } 
          });
        })
        .fail(function(){
          window.alert('読み込みエラー');
        });  // $.ajax() end

        $('.check').on('click', function(){
          if ($(this).hasClass('crowded')) {
            $(this).text('残席わずか').addClass('red');
          } else {
            $(this).text('お席あります').addClass('green');
          }
        });
    });  // $() end

  </script>
</body>

</html>
