<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
        <table border="1">
          <tr>
            <th>書名</th>
            <th>値段</th>
            <th>在庫</th>
          </tr>
          <tr>
            <td id="title"></td>
            <td id="price"></td>
            <td id="stock"></td>
          </tr>
        </table>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script>
    'use strict';

    $(function () {
      let jsbook = {
        title: 'JavaScript入門',
        price: 2500,
        stock: 3,
      };

      $('#title').text(jsbook.title);
      $('#price').text(jsbook.price);
      $('#stock').text(jsbook.stock);
    });

  </script>
</body>

</html>
