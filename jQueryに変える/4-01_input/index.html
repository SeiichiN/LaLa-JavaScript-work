<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
        <form action="#" id="form">
          <input type="text" name="word" id="kotoba">
          <input type="submit" value="検索">
        </form>

        <p id="output"></p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script>
    'use strict';

    $(function () {
      $('#form').on('submit', function (event) {
        event.preventDefault();
        // const search = $('input[name="word"]').val();
        const search = $('#kotoba').val();
        $('#output').text(`[${search}]の検索中...`);
      }); 
    });

  </script>
</body>

</html>
