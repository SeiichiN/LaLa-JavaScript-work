<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <div class="container">
      <h1>コンソールにアウトプット</h1>
      <h2>開発ツール</h2>
    </div>
  </header>

  <main>
    <div class="container">
      <section>
        <p>円周率は <span id="pi"></span> です。</p>
        <p>ふつうに切り捨てると <span id="floor"></span> です。</p>
        <p>小数第2位で切り捨てると <span id="output"></span> です。</p>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>JavaScript Samples</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"
    integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
  <script>
    'use strict';

    $(function () {
      $('#pi').text(Math.PI);
      $('#floor').text(Math.floor(Math.PI));
      $('#output').text(point(Math.PI, 2));

      function point(num, digit) {
        const mover = 10 ** digit;  // 10のdigit乗
        return Math.floor(num * mover) / mover;
      }
    });

  </script>
</body>

</html>
