<html>
<body>
  <h1>好きな食べ物</h1>
  
  <section id="foods">
  </section>
  
  <script>
    'use strict';
    
    let foods = ['お好み焼き', 'きつねうどん', 'お寿司'];
  	for (let food of foods) {
  	  let ele = `<p>${food}</p>`;
  	  document.getElementById('foods')
  	          .insertAdjacentHTML('beforeend', ele);
  	}
  </script>
</body>
</html>
