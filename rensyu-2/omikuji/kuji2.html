<html>
<head>
  <style>
    #btn {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>おみくじ</h1>
  
  <div id="btn">くじをひく</div>
    
  <div id="result"></div>
  
  <script>
    'use strict';
    
    function myRand(min, max) {
      return Math.floor(Math.random() * (max - min +1)) + min;
    }
    
    document.getElementById('btn').onclick = function() {
      let num = myRand(0, 4);
      let omikuji = ['大吉', '中吉', '小吉', '末吉', '凶'];
      let kekka = omikuji[num];
      document.getElementById('result').textContent = kekka;
    };
  </script>
</body>
</html>
