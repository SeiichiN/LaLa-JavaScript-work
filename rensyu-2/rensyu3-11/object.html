<html>
<body>
  <h1>オブジェクト</h1>
  <section>
    <table>
      <tr>
        <th>商品名</th>
        <th>値段</th>
        <th>数量</th>
      </tr>
      <td id="name"></td>
      <td id="price"></td>
      <td id="quantity"></td>
    </table>
  </section>
  
  <script>
    'use strict';
    
    let product = {
          name: 'バナナ',
          price: 300,
          quantity: 2
        };

    document.getElementById('name').textContent = product.name;
    document.getElementById('price').textContent = product.price;
    document.getElementById('quantity').textContent = product.quantity;
    
  </script>
</body>
</html>
