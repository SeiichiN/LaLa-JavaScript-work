<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <h1>練習3-2</h1>
  <script>
    'use strict';
  
    let msg = "";
    const isAdult = window.prompt('あなたは20歳以上ですか？(yes/no)');
    if (isAdult === 'yes') {
      msg = '飲みすぎに注意しましょう';
    } else if (isAdult === 'no') {
      msg = 'お酒は二十歳から';
    } else {
      msg = 'yesかnoで答えてください';
    }
    window.alert(msg);
  </script>
</body>
</html>
